<div class="login-wrapper">
  <div class="login-container">
    
    <!-- Tarjeta Izquierda (Información) -->
    <div class="card info-card">
      <img src="dgeti.svg" alt="Logo DGETI" class="login-logo">
      <h2>Iniciar sesión</h2>
      <ul class="info-list">
        <li>• Accede a tus servicios</li>
        <li>• Consulta de prácticas y becas</li>
      </ul>
    </div>

    <!-- Tarjeta Derecha (Formulario) -->
    <div class="card form-card">
      <div class="form-header">
        <h3>Accede a tu cuenta</h3>
        <p>Ingresa tus credenciales para continuar.</p>
      </div>
      
      <form class="login-form">
        <div class="input-group">
          <label for="email">Email o matrícula</label>
          <input type="text" id="email" placeholder="">
        </div>
        
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="">
        </div>
        
        <div class="form-actions">
          <label class="checkbox-container">
            <input type="checkbox"> Recuérdame
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
        
        <button type="button" class="btn-submit">Iniciar sesión</button>
      </form>
    </div>

  </div>
</div>
